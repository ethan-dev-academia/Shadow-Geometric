[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shadow-geometric"
version = "0.1.0"
description = "Reproducibility repo for Shadow: In-Situ Geometric Characterization of LLM Reasoning Manifolds via Bayesian Networks and Forman-Ricci Curvature, with Directional Ricci-Tensor Steering"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/SynthsssW/Shadow-Geometric"
